<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Contratante | ConectaTalentos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/variables.css"><link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css"><link rel="stylesheet" href="../../css/navbar.css">
  <link rel="stylesheet" href="../../css/cards.css"><link rel="stylesheet" href="../../css/forms.css"><link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div id="navbar"></div>
<main class="form-page py-5">
  <div class="container form-container">
    <div class="text-center mb-4">
      <div class="form-icon"><i class="bi bi-building"></i></div>
      <span class="section-label">CADASTRO DE CONTRATANTE</span>
      <h1 class="display-6 fw-bold mt-2">Crie sua conta</h1>
      <p class="text-muted">Apresente sua empresa ou atividade e encontre talentos.</p>
    </div>
    <div class="form-card p-4 p-md-5">
      <form id="formCadastroContratante">
        <h2 class="form-section-title"><i class="bi bi-building me-2"></i>Dados da conta</h2>
        <div class="row g-4">
          <div class="col-md-6"><label class="form-label" for="responsavel">Nome do responsável</label><input class="form-control" id="responsavel" name="responsavel" required placeholder="Nome completo"></div>
          <div class="col-md-6"><label class="form-label" for="empresa">Empresa / negócio</label><input class="form-control" id="empresa" name="empresa" required placeholder="Nome da empresa"></div>
          <div class="col-md-6"><label class="form-label" for="email">E-mail</label><input class="form-control" id="email" name="email" type="email" required placeholder="contato@empresa.com"></div>
          <div class="col-md-6"><label class="form-label" for="telefone">Telefone</label><input class="form-control" id="telefone" name="telefone" placeholder="(00) 00000-0000"></div>
          <div class="col-md-6"><label class="form-label" for="senha">Senha</label><input class="form-control" id="senha" name="senha" type="password" minlength="6" required placeholder="Crie uma senha"></div>
          <div class="col-md-6"><label class="form-label" for="confirmarSenha">Confirmar senha</label><input class="form-control" id="confirmarSenha" name="confirmarSenha" type="password" required placeholder="Digite novamente"></div>
        </div>
        <h2 class="form-section-title mt-5"><i class="bi bi-card-text me-2"></i>Sobre o contratante</h2>
        <div class="row g-4">
          <div class="col-md-6"><label class="form-label" for="area">Área de atuação</label><input class="form-control" id="area" name="area" required placeholder="Ex.: Tecnologia"></div>
          <div class="col-md-6"><label class="form-label" for="localizacao">Localização</label><input class="form-control" id="localizacao" name="localizacao" required placeholder="Ex.: Fortaleza - CE"></div>
          <div class="col-12"><label class="form-label" for="descricao">Sobre a empresa / atividade</label><textarea class="form-control" id="descricao" name="descricao" rows="4" placeholder="Conte um pouco sobre sua empresa, projeto ou atividade."></textarea></div>
          <div class="col-12"><label class="form-label" for="tecnologias">Áreas e tecnologias procuradas</label><input class="form-control" id="tecnologias" name="tecnologias" placeholder="Ex.: Front-end, Design, Marketing"></div>
          <div class="col-md-6"><label class="form-label" for="site">Site</label><input class="form-control" id="site" name="site" type="url" placeholder="https://seusite.com"></div>
          <div class="col-md-6"><label class="form-label" for="linkedin">LinkedIn</label><input class="form-control" id="linkedin" name="linkedin" type="url" placeholder="https://linkedin.com/company/..."></div>
        </div>
        <div class="mt-5"><div class="form-check"><input class="form-check-input" type="checkbox" id="termos" required><label class="form-check-label" for="termos">Concordo com os termos de uso e política de privacidade.</label></div></div>
        <div class="d-flex flex-column flex-sm-row gap-3 justify-content-between mt-5">
          <a href="cadastro.html" class="btn btn-outline-brand rounded-pill px-4"><i class="bi bi-arrow-left me-1"></i>Voltar</a>
          <button type="submit" class="btn btn-brand rounded-pill px-4">Criar conta <i class="bi bi-check-lg ms-1"></i></button>
        </div>
      </form>
    </div>
  </div>
</main>
<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
import { renderNavbar } from "../../js/components/navbar.js";
import { renderFooter } from "../../js/components/footer.js";
import "../../js/pages/cadastro-contratante.js";
document.addEventListener("DOMContentLoaded", () => { renderNavbar(); renderFooter(); });
</script>
</body></html>
