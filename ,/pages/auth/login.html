<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | ConectaTalentos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/variables.css"><link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css"><link rel="stylesheet" href="../../css/navbar.css">
  <link rel="stylesheet" href="../../css/forms.css"><link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div id="navbar"></div>
<main class="form-page py-5">
  <div class="container" style="max-width:560px">
    <div class="text-center mb-4">
      <div class="form-icon"><i class="bi bi-box-arrow-in-right"></i></div>
      <span class="section-label">BEM-VINDO DE VOLTA</span>
      <h1 class="display-6 fw-bold mt-2">Entrar na sua conta</h1>
      <p class="text-muted">Acesse seu perfil e continue sua jornada.</p>
    </div>
    <div class="form-card p-4 p-md-5">
      <form id="formLogin">
        <div class="mb-4"><label class="form-label" for="email">E-mail</label><input class="form-control" id="email" name="email" type="email" required placeholder="seuemail@email.com"></div>
        <div class="mb-4"><label class="form-label" for="senha">Senha</label><input class="form-control" id="senha" name="senha" type="password" required placeholder="Sua senha"></div>
        <button class="btn btn-brand btn-lg w-100 rounded-pill" type="submit">Entrar</button>
      </form>
      <div class="text-center mt-4"><span class="text-light-emphasis">Ainda não possui conta?</span> <a href="cadastro.html" class="text-brand fw-semibold">Criar conta</a></div>
    </div>
  </div>
</main>
<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
import { renderNavbar } from "../../js/components/navbar.js";
import { renderFooter } from "../../js/components/footer.js";
import "../../js/pages/login.js";
document.addEventListener("DOMContentLoaded", () => { renderNavbar(); renderFooter(); });
</script>
</body></html>
