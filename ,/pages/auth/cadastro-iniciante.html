<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Iniciante | ConectaTalentos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/variables.css"><link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css"><link rel="stylesheet" href="../../css/navbar.css">
  <link rel="stylesheet" href="../../css/cards.css"><link rel="stylesheet" href="../../css/forms.css"><link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div id="navbar"></div>
<main class="form-page py-5">
  <div class="container form-container">
    <div class="text-center mb-4">
      <div class="form-icon"><i class="bi bi-person"></i></div>
      <span class="section-label">CADASTRO DE INICIANTE</span>
      <h1 class="display-6 fw-bold mt-2">Crie seu perfil</h1>
      <p class="text-muted">Conte um pouco sobre você e suas habilidades.</p>
    </div>
    <div class="form-card p-4 p-md-5">
      <form id="formCadastroIniciante">
        <h2 class="form-section-title"><i class="bi bi-person-circle me-2"></i>Dados da conta</h2>
        <div class="row g-4">
          <div class="col-md-6"><label class="form-label" for="nome">Nome completo</label><input class="form-control" id="nome" name="nome" required placeholder="Digite seu nome"></div>
          <div class="col-md-6"><label class="form-label" for="email">E-mail</label><input class="form-control" id="email" name="email" type="email" required placeholder="seuemail@email.com"></div>
          <div class="col-md-6"><label class="form-label" for="senha">Senha</label><input class="form-control" id="senha" name="senha" type="password" minlength="6" required placeholder="Crie uma senha"><div class="form-text">Mínimo de 6 caracteres.</div></div>
          <div class="col-md-6"><label class="form-label" for="confirmarSenha">Confirmar senha</label><input class="form-control" id="confirmarSenha" name="confirmarSenha" type="password" required placeholder="Digite novamente"></div>
        </div>
        <h2 class="form-section-title mt-5"><i class="bi bi-person-vcard me-2"></i>Seu perfil</h2>
        <div class="row g-4">
          <div class="col-md-6"><label class="form-label" for="area">Área de interesse</label><select class="form-select" id="area" name="area" required><option value="">Selecione</option><option>Tecnologia</option><option>Design</option><option>Marketing</option><option>Administração</option><option>Comunicação</option><option>Educação</option><option>Outra</option></select></div>
          <div class="col-md-6"><label class="form-label" for="localizacao">Localização</label><input class="form-control" id="localizacao" name="localizacao" required placeholder="Ex.: Fortaleza - CE"></div>
          <div class="col-12"><label class="form-label" for="habilidades">Habilidades</label><input class="form-control" id="habilidades" name="habilidades" placeholder="Ex.: HTML, CSS, JavaScript"><div class="form-text">Separe por vírgulas.</div></div>
          <div class="col-12"><label class="form-label" for="bio">Sobre você</label><textarea class="form-control" id="bio" name="bio" rows="4" placeholder="Conte um pouco sobre você, objetivos e experiências."></textarea></div>
        </div>
        <h2 class="form-section-title mt-5"><i class="bi bi-link-45deg me-2"></i>Portfólio e links</h2>
        <div class="row g-4">
          <div class="col-md-6"><label class="form-label" for="linkedin">LinkedIn</label><input class="form-control" id="linkedin" name="linkedin" type="url" placeholder="https://linkedin.com/in/seuperfil"></div>
          <div class="col-md-6"><label class="form-label" for="github">GitHub / Portfólio</label><input class="form-control" id="github" name="github" type="url" placeholder="https://github.com/seuperfil"></div>
        </div>
        <div class="mt-5"><div class="form-check"><input class="form-check-input" type="checkbox" id="termos" required><label class="form-check-label" for="termos">Concordo com os termos de uso e política de privacidade.</label></div></div>
        <div class="d-flex flex-column flex-sm-row gap-3 justify-content-between mt-5">
          <a href="cadastro.html" class="btn btn-outline-brand rounded-pill px-4"><i class="bi bi-arrow-left me-1"></i>Voltar</a>
          <button type="submit" class="btn btn-brand rounded-pill px-4">Criar minha conta <i class="bi bi-check-lg ms-1"></i></button>
        </div>
      </form>
    </div>
  </div>
</main>
<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
import { renderNavbar } from "../../js/components/navbar.js";
import { renderFooter } from "../../js/components/footer.js";
import "../../js/pages/cadastro-iniciante.js";
document.addEventListener("DOMContentLoaded", () => { renderNavbar(); renderFooter(); });
</script>
</body></html>
