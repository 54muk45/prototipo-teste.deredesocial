TYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Busca | ConectaTalentos</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <!-- Fonte -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- CSS do projeto -->
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/navbar.css">
    <link rel="stylesheet" href="../../css/cards.css">
    <link rel="stylesheet" href="../../css/responsive.css">

</head>

<body>

    <!-- Navbar carregada pelo JavaScript -->
    <div id="navbar"></div>


    <!-- Conteúdo principal da página -->
    
<main class="py-5">
  <div class="container py-3">

    <span class="section-label">EXPLORAR</span>
    <h1 class="fw-bold mt-2">Encontre pessoas e talentos</h1>
    <p class="text-muted">
      Descubra pessoas por habilidades, área ou localização.
    </p>

    <div class="row g-3 mt-3">
      <div class="col-md-6">
        <label for="q" class="form-label">Nome ou habilidade</label>
        <input
          id="q"
          class="form-control form-control-lg"
          placeholder="Ex.: João, HTML, design..."
        >
      </div>

      <div class="col-md-3">
        <label for="filtroArea" class="form-label">Área</label>
        <select id="filtroArea" class="form-select form-select-lg">
          <option value="">Todas as áreas</option>
          <option value="tecnologia">Tecnologia</option>
          <option value="design">Design</option>
          <option value="marketing">Marketing</option>
          <option value="administração">Administração</option>
          <option value="comunicação">Comunicação</option>
          <option value="educação">Educação</option>
          <option value="outra">Outra</option>
        </select>
      </div>

      <div class="col-md-3">
        <label for="filtroLocal" class="form-label">Localização</label>
        <input
          id="filtroLocal"
          class="form-control form-control-lg"
          placeholder="Ex.: Fortaleza"
        >
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-5 mb-3">
      <h2 class="h4 fw-bold mb-0">Pessoas encontradas</h2>
      <span id="contador" class="text-muted"></span>
    </div>

    <div id="resultados" class="row g-4"></div>

  </div>
</main>



    <!-- Rodapé carregado pelo JavaScript -->
    <div id="footer"></div>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <!-- Componentes do projeto -->
    <script type="module">

        import {
            renderNavbar
        } from "../../js/components/navbar.js";

        import {
            renderFooter
        } from "../../js/components/footer.js";
import "../../js/pages/busca.js";

        document.addEventListener("DOMContentLoaded", () => {

            renderNavbar();

            renderFooter();

        });

    </script>

</body>

</html>
